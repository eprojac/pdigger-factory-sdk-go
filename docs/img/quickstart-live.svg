<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 927" width="1000" height="927" role="img" aria-labelledby="t d">
  <title id="t">Quickstart: follow the camera</title>
  <desc id="d">Real output of examples/quickstart following a factorytest fake unit whose shared session plays the fixture recording aug28-1270-1300 (video aug28, 21:10.0 to 21:40.0, frames g 6350 to 6500), stopped after the place of stone 2660 at 21:21.8 (g 6409). Highlighted: the move of stone 2660. Drawn by tools/pictures from what the SDK prints.</desc>
  <style>
    .bg { fill: #f6f4f0; }
