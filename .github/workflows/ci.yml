name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: gofmt, go vet, staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: |
          go vet ./...
          (cd examples && go vet ./...)
          (cd tools && go vet ./...)
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          staticcheck ./...
          (cd examples && staticcheck ./...)
          (cd tools && staticcheck ./...)

  test:
    name: unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Unit tests, race detector, 100 % coverage, golden outputs, examples, pictures
        run: sh scripts/test.sh
      - name: Coverage report
        if: always()
        run: go tool cover -func=cover.out | tail -1

  docker:
    name: unit tests in Docker (make test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make test (no network inside the container)
        run: make test

  docs:
    name: API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: go doc
        run: make docs
      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: api-reference/
